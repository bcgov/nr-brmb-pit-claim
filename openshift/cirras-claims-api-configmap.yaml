kind: ConfigMap
apiVersion: v1
metadata:
  name: cirras-claims-api-config-#{ENV}#
  namespace: '#{NAMESPACE}#'
immutable: false
data:
  TOMCAT_PORT: '#{TOMCAT_PORT}#'
  TOMCAT_MAX_THREADS: '#{TOMCAT_MAX_THREADS}#'
  CONNECTION_TIMEOUT: '#{CONNECTION_TIMEOUT}#'
  KEYCLOAK_ISSUER_URI: '#{KEYCLOAK_ISSUER_URI}#'
  KEYCLOAK_TOKEN_ENDPOINT: '#{KEYCLOAK_TOKEN_ENDPOINT}#'
  CIRRAS_POLICIES_API_URL: '#{CIRRAS_POLICIES_API_URL}#'
  CIRRAS_UNDERWRITING_API_URL: '#{CIRRAS_UNDERWRITING_API_URL}#'
  POSTGRES_MAXACTIVE: '#{POSTGRES_MAXACTIVE}#'
  POSTGRES_URL: >-
    jdbc:postgresql://crunchy-postgres-#{ENV}#-pgbouncer.#{NAMESPACE}#.svc.cluster.local/pitcc#{ENV}#
  POSTGRES_RESOURCE_NAME: '#{POSTGRES_RESOURCE_NAME}#'
  CIRRAS_CLAIMS_REST_CLIENT_ID: '#{CIRRAS_CLAIMS_REST_CLIENT_ID}#'
  POSTGRES_USERNAME: '#{POSTGRES_USERNAME}#'
  TIME_ZONE: '#{TIME_ZONE}#'
  LOG_LEVEL: '#{LOG_LEVEL}#'
  EMAIL_HOST_NAME: '#{EMAIL_HOST_NAME}#'
  EMAIL_PORT: '#{EMAIL_PORT}#'
  EMAIL_FROM_ADDRESS: '#{EMAIL_FROM_ADDRESS}#'
  MESSAGE_QUEUE_URL: '#{MESSAGE_QUEUE_URL}#'
  EMAIL_MASTER_TASK_SYNCH_ERROR_SUBJECT: '#{EMAIL_MASTER_TASK_SYNCH_ERROR_SUBJECT}#'
  EMAIL_OUTBOX_SYNCH_ERROR_SUBJECT: '#{EMAIL_OUTBOX_SYNCH_ERROR_SUBJECT}#'
  EMAIL_ADMIN_ADDRESS: '#{EMAIL_ADMIN_ADDRESS}#'
  EMAIL_ERROR_SEND_FREQUENCY: '#{EMAIL_ERROR_SEND_FREQUENCY}#'
  APPLICATION_ENVIRONMENT_NAME: '#{ENV}#'
  POLLING_OUTBOX_ENABLED: '#{POLLING_OUTBOX_ENABLED}#'
  POLLING_OUTBOX_SECONDS_FREQUENCY: '#{POLLING_OUTBOX_SECONDS_FREQUENCY}#'
  POLLING_OUTBOX_MAX_RECORDS: '#{POLLING_OUTBOX_MAX_RECORDS}#'
  POLLING_OUTBOX_MAX_ITERATIONS: '#{POLLING_OUTBOX_MAX_ITERATIONS}#'